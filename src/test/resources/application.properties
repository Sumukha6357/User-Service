spring.datasource.url=jdbc:h2:mem:testdb;MODE=MYSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

app.security.jwt-secret=test-test-test-test-test-test-test-secret
app.security.jwt-expiration-seconds=3600
app.security.admin-username=admin
app.security.admin-password=admin123
app.security.viewer-username=viewer
app.security.viewer-password=viewer123
