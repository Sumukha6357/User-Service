server.port=${SERVER_PORT:8080}
app.cors-origin=${APP_CORS_ORIGIN:http://localhost:3000}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/user_service?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.flyway.enabled=true

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true

app.security.jwt-secret=${APP_SECURITY_JWT_SECRET:replace-with-at-least-32-characters-secret-key}
app.security.jwt-expiration-seconds=${APP_SECURITY_JWT_EXPIRATION_SECONDS:3600}
app.security.admin-username=${APP_SECURITY_ADMIN_USERNAME:admin}
app.security.admin-password=${APP_SECURITY_ADMIN_PASSWORD:admin123}
app.security.viewer-username=${APP_SECURITY_VIEWER_USERNAME:viewer}
app.security.viewer-password=${APP_SECURITY_VIEWER_PASSWORD:viewer123}
