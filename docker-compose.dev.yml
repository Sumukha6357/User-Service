services:
  db:
    image: mysql:8.4
    container_name: user-service-db-dev
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "${MYSQL_PORT}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    image: maven:3.9.9-eclipse-temurin-17
    container_name: user-service-api-dev
    working_dir: /app
    command: ["./mvnw", "spring-boot:run"]
    volumes:
      - ./api:/app
      - maven_cache:/root/.m2
    environment:
      SERVER_PORT: 8080
      APP_CORS_ORIGIN: ${APP_CORS_ORIGIN}
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      APP_SECURITY_JWT_SECRET: ${APP_SECURITY_JWT_SECRET}
      APP_SECURITY_JWT_EXPIRATION_SECONDS: ${APP_SECURITY_JWT_EXPIRATION_SECONDS}
      APP_SECURITY_ADMIN_USERNAME: ${APP_SECURITY_ADMIN_USERNAME}
      APP_SECURITY_ADMIN_PASSWORD: ${APP_SECURITY_ADMIN_PASSWORD}
      APP_SECURITY_VIEWER_USERNAME: ${APP_SECURITY_VIEWER_USERNAME}
      APP_SECURITY_VIEWER_PASSWORD: ${APP_SECURITY_VIEWER_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_PORT}:8080"

  web:
    image: node:20-alpine
    container_name: user-service-web-dev
    working_dir: /app
    command: ["sh", "-c", "npm install && npm run dev -- --hostname 0.0.0.0 --port 3000"]
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
    depends_on:
      api:
        condition: service_started
    ports:
      - "${WEB_PORT}:3000"

volumes:
  mysql_data:
  maven_cache:
  web_node_modules:
